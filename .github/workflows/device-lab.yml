name: device lab packages

on:
  workflow_dispatch:
  push:
    tags: ["lab-v*"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: qenlo-lab-linux-x86_64
            binary: target/release/qenlo-lab
          - os: windows-2025
            artifact: qenlo-lab-windows-x86_64
            binary: target/release/qenlo-lab.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: cargo build --locked --release -p qenlo-testkit --bin qenlo-lab
      - shell: bash
        run: |
          mkdir -p package
          cp "${{ matrix.binary }}" package/
          cp docs/device-lab.md package/README.md
          cd package
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "9.5.0" }
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: rustup target add aarch64-linux-android --toolchain 1.98.0
      - run: cargo install cargo-ndk --locked
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: cargo ndk -t arm64-v8a -o apps/android/app/src/main/jniLibs build --locked --release -p qenlo-mobile
      - working-directory: apps/android
        run: gradle --no-daemon assembleDebug
      - run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qenlo-lab-android-arm64
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: cargo build --locked --release -p qenlo-testkit --bin qenlo-lab
      - run: |
          mkdir -p package
          cp target/release/qenlo-lab package/
          cp docs/device-lab.md package/README.md
          cd package
          shasum -a 256 * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qenlo-lab-macos-arm64
          path: package
          if-no-files-found: error
      - run: brew install xcodegen
      - working-directory: apps/ios
        run: xcodegen generate
      - working-directory: apps/ios
        run: xcodebuild -project QenloLab.xcodeproj -scheme QenloLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: qenlo-lab-ios-unsigned-validation
          path: ~/Library/Developer/Xcode/DerivedData/QenloLab-*/Build/Products/Release-iphoneos/Qenlo Lab.app
          if-no-files-found: error

  telemetry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - run: cargo build --locked --release -p qenlo-telemetry
      - run: sha256sum target/release/qenlo-telemetry > target/release/qenlo-telemetry.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qenlo-telemetry-linux-x86_64
          path: |
            target/release/qenlo-telemetry
            target/release/qenlo-telemetry.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/lab-v')
    needs: [desktop, android, apple, telemetry]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Pack release assets
        run: |
          mkdir release
          for directory in artifacts/*; do
            name="$(basename "$directory")"
            (cd "$directory" && zip -qr "../../release/$name.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
          cat > release-notes.md <<EOF
          ## Qenlo device lab $GITHUB_REF_NAME

          A cross-platform conformance and performance suite for comparing Qenlo on real hardware. Each run checks exact CPU/GPU correctness, filtering, durable reopen, IVF recall gates, routing decisions, latency percentiles, transfers, allocations, dispatches, and failures.

          ### Downloads

          | Asset | Use |
          | --- | --- |
          | `qenlo-lab-linux-x86_64.zip` | Linux x86_64 with NVIDIA, AMD, or Intel adapters |
          | `qenlo-lab-windows-x86_64.zip` | Windows x86_64 with NVIDIA, AMD, or Intel adapters |
          | `qenlo-lab-macos-arm64.zip` | Apple-silicon macOS |
          | `qenlo-lab-android-arm64.zip` | Android arm64, including Snapdragon and MediaTek |
          | `qenlo-lab-ios-unsigned-validation.zip` | A-series iOS build validation; unsigned and not installable yet |
          | `qenlo-telemetry-linux-x86_64.zip` | Self-hosted HTTPS telemetry collector and viewer |

          ### Quick start

          1. Download the package for the device and verify it with `SHA256SUMS`.
          2. Run the quick profile first; keep the device foregrounded and on power for full or soak profiles.
          3. Keep the retained JSON report. Mobile builds can copy it and open the GitHub report form; desktop builds save `qenlo-lab-run.json` beside the executable.

          ### Telemetry

          For automatic authenticated ingestion, deploy the telemetry binary behind HTTPS. For a zero-server round, use the [public GitHub report form](https://github.com/a3ro-dev/qenlo/issues/new?template=device-lab-report.yml). Reports contain aggregate measurements and device class only; the form makes their public visibility explicit.

          ### Important limits

          Windows and macOS archives are tester builds and are not Authenticode/Developer ID notarized. The Android APK is a debug build. The iOS archive is unsigned validation output and requires your Apple Developer provisioning identity before it can be installed. Do not treat these archives as production-signed software.

          Build provenance: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) · [Actions run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Qenlo device lab $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release/*.zip release/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
