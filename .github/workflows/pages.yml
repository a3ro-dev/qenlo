name: Deploy Static Landing to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'docs/**'
      - 'assets/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.well-known/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r docs assets _site/
          [ -f llms.txt ] && cp llms.txt _site/ || true
          [ -f llms-full.txt ] && cp llms-full.txt _site/ || true
          [ -d .well-known ] && cp -r .well-known _site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
