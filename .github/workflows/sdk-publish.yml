name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable SDK release tag (sdk-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/check_release_versions.py "$RELEASE_TAG"
          python scripts/check_docs.py
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  crates:
    needs: verify
    runs-on: ubuntu-24.04
    environment: package-registries
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.verify.outputs.tag }}" }
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p qenlo-core
          sleep 30
          cargo publish --locked -p qenlo

  pypi:
    needs: verify
    runs-on: ubuntu-24.04
    environment: package-registries
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'qenlo-*.whl' --dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  npm:
    needs: verify
    runs-on: ubuntu-24.04
    environment: package-registries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - name: Download and publish npm package
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir dist
          npm publish ./dist/*.tgz --access public --tag alpha --provenance

  maven-central:
    needs: verify
    runs-on: ubuntu-24.04
    environment: package-registries
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.verify.outputs.tag }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - name: Download native libraries and assemble resource layout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p native
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'libqenlo_ffi.so' --pattern 'qenlo_ffi.dll' --pattern 'libqenlo_ffi.dylib' --dir native || true
          mkdir -p sdk/kotlin/src/main/resources/qenlo/{linux-x64,windows-x64,darwin-arm64}
          cp native/libqenlo_ffi.so sdk/kotlin/src/main/resources/qenlo/linux-x64/ 2>/dev/null || true
          cp native/qenlo_ffi.dll sdk/kotlin/src/main/resources/qenlo/windows-x64/ 2>/dev/null || true
          cp native/libqenlo_ffi.dylib sdk/kotlin/src/main/resources/qenlo/darwin-arm64/ 2>/dev/null || true
      - name: Publish signed bundle to Maven Central
        working-directory: sdk/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "Skipping Maven Central: credentials not configured"
            exit 0
          fi
          gradle --no-daemon publishAllPublicationsToMavenCentralRepository

  verify-supported-registries:
    needs: [verify, crates, pypi, npm]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Rust, Python, and npm packages to resolve
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("sdk-v")
          python_version = version.replace("-alpha.", "a")
          urls = {
              "crates.io/qenlo": f"https://crates.io/api/v1/crates/qenlo/{version}",
              "crates.io/qenlo-core": f"https://crates.io/api/v1/crates/qenlo-core/{version}",
              "PyPI/qenlo": f"https://pypi.org/pypi/qenlo/{python_version}/json",
              "npm/@a3ro.dev/qenlo": "https://registry.npmjs.org/" + urllib.parse.quote("@a3ro.dev/qenlo", safe="") + "/" + version,
          }
          pending = dict(urls)
          for _ in range(20):
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          if response.status == 200:
                              del pending[name]
                  except Exception:
                      pass
              if not pending:
                  break
              time.sleep(15)
          if pending:
              raise SystemExit("published package did not resolve: " + ", ".join(pending))
          print(json.dumps({"version": version, "verified": sorted(urls)}, indent=2))
          PY
