name: SDK conformance

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/qenlo-core/**"
      - "crates/qenlo/**"
      - "crates/qenlo-ffi/**"
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/qenlo-core/**"
      - "crates/qenlo/**"
      - "crates/qenlo-ffi/**"
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always runs: Linux SDK conformance ─────────────────────────────
  native-and-sdks:
    name: ubuntu-24.04 SDKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: sdk/typescript/pnpm-lock.yaml }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.x", cache-dependency-path: sdk/go/go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }

      - name: Build and test the shared ABI
        shell: bash
        run: |
          cmp crates/qenlo-ffi/qenlo.h sdk/go/native/qenlo.h
          cargo test --locked -p qenlo-ffi
          cargo test --locked -p qenlo-ffi --features gpu-wgpu
          cargo build --locked --release -p qenlo-ffi --features gpu-wgpu

      - name: Export native library paths
        shell: bash
        run: |
          native="$GITHUB_WORKSPACE/target/release/libqenlo_ffi.so"
          echo "QENLO_LIBRARY_PATH=$native" >> "$GITHUB_ENV"
          echo "QENLO_LIBRARY_DIR=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"
          mkdir -p "sdk/go/native/linux-amd64"
          cp "$native" "sdk/go/native/linux-amd64/"
          mkdir -p "sdk/python/native"
          cp "$native" "sdk/python/native/"
          mkdir -p "sdk/typescript/native/linux-x64"
          cp "$native" "sdk/typescript/native/linux-x64/"
          cp LICENSE sdk/typescript/
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"

      - name: Python static and runtime conformance
        run: |
          python -m pip install --disable-pip-version-check pytest pyright numpy
          export PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src"
          python -m pyright sdk/python/src
          python -m pytest sdk/python/tests -q
          python -m pip install --disable-pip-version-check build
          QENLO_WHEEL_TAG=py3-none-manylinux_2_28_x86_64 python -m build sdk/python --wheel
          python -c "import zipfile,glob; p=glob.glob('sdk/python/dist/*.whl')[0]; z=zipfile.ZipFile(p); assert any(n.endswith('libqenlo_ffi.so') for n in z.namelist()), z.namelist()"

      - name: Python optional tensor conformance
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          export PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src"
          python -m pytest sdk/python/tests/test_torch_index.py -q

      - name: TypeScript type and runtime conformance
        working-directory: sdk/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
          npm pack --dry-run

      - name: Go vet and runtime conformance
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Kotlin explicit API and runtime conformance
        working-directory: sdk/kotlin
        run: gradle --no-daemon build

  rust-public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-features
          cargo doc --workspace --all-features --no-deps
