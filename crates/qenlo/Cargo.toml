[package]
name = "qenlo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Observable embedded filtered vector search with durable collections"
readme = "../../README.md"
keywords = ["vector-search", "embedded", "database", "gpu", "similarity"]
categories = ["database-implementations", "algorithms"]

[features]
default = []
usearch = ["dep:usearch"]
gpu-wgpu = ["dep:wgpu"]

[dependencies]
async-lock = "3"
crc32fast.workspace = true
memmap2.workspace = true
qenlo-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
usearch = { version = "2.26.1", optional = true }
wgpu = { version = "30.0.1", optional = true }
