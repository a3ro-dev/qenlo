<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Qenlo documentation: embedded filtered vector search, portable storage, SDKs, and reproducible benchmarks.">
  <title>Qenlo Documentation</title>
  <link rel="icon" href="../assets/brand/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/brand/tokens.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    /* Same paper / ink / red palette as the project home page. */
    :root {
      --base-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --base-font-size: 16px;
      --base-line-height: 1.7;
      --theme-color: #B53C2F;
      --base-background-color: #ececeb;
      --base-color: #2b322e;
      --heading-color: #1D2320;
      --heading-font-weight: 600;
      --link-color: #B53C2F;
      --link-color--hover: #8f2d23;
      --content-max-width: 820px;
      --sidebar-width: 290px;
      --sidebar-background: #e3e2df;
      --sidebar-border-color: #d3d1cb;
      --sidebar-border-width: 1px;
      --sidebar-name-color: #1D2320;
      --sidebar-nav-link-color: #3E4642;
      --sidebar-nav-link-color--active: #B53C2F;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-strong-color: #1D2320;
      --code-theme-background: #171C19;
      --code-theme-text: #E8EBE9;
      --blockquote-border-color: #B53C2F;
      --blockquote-background: #e3e2df;
      --blockquote-color: #1D2320;
      --table-head-background: #e3e2df;
      --table-row-odd-background: transparent;
      --table-body-border-color: #d3d1cb;
      --table-head-border-color: #b9b6ae;
    }
    body { background: var(--base-background-color); }
    .markdown-section { padding-top: 28px; }
    .markdown-section h1 { font-size: 2.1rem; letter-spacing: -0.02em; margin-bottom: 1rem; }
    .markdown-section h2 { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid #d3d1cb; }
    .markdown-section a { text-decoration: none; }
    .markdown-section a:hover { text-decoration: underline; }
    .app-name-link img { max-height: 30px; width: auto; }
    .sidebar { padding-top: 6px; }
    .sidebar ul li strong { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #5A615D; }
    .sidebar .search input { background: #ececeb; border: 1px solid #c9c6be; border-radius: 6px; }
    .sidebar .search input:focus { border-color: #B53C2F; box-shadow: 0 0 0 2px rgba(181,60,47,.18); }
    .app-nav a { font-family: var(--code-font-family); font-size: .8rem; color: #3E4642 !important; }
    .app-nav a:hover { color: #B53C2F !important; }
    :not(pre) > code { background: #e3e2df !important; color: #8f2d23 !important; border-radius: 4px; padding: .12em .35em; font-size: .88em; }
    pre { border-radius: 8px; }
    table { display: block; overflow-x: auto; }
    .github-corner svg { fill: #1D2320 !important; color: #ececeb !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #b9b6ae; border-radius: 4px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 1.4rem 0; }
    .card-grid a { display: block; padding: 16px 18px; background: #e3e2df; border: 1px solid #d3d1cb; border-radius: 8px; color: #1D2320; text-decoration: none !important; }
    .card-grid a:hover { border-color: #B53C2F; }
    .card-grid strong { display: block; margin-bottom: 4px; }
    .card-grid span { color: #5A615D; font-size: .9rem; }
  </style>
</head>
<body>
  <div id="app">Loading Qenlo documentation...</div>
  <script>
    window.$docsify = {
      name: 'Qenlo',
      logo: '../assets/brand/logo/lockup.svg',
      repo: 'https://github.com/a3ro-dev/qenlo',
      loadSidebar: true,
      loadNavbar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md', '/.*/_navbar.md': '/_navbar.md' },
      notFoundPage: { '/.*': '/README.md' },
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      markdown: {
        renderer: {
          code(code, language) {
            if (language === 'mermaid') {
              return `<div class="mermaid">${code}</div>`;
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {

            if (window.mermaid) {
              mermaid.run({ querySelector: '.mermaid:not([data-processed])' });
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      securityLevel: 'strict'
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
</body>
</html>
