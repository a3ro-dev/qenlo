<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Qenlo documentation for embedded filtered vector search, portable storage, SDKs, and reproducible benchmarks.">
  <title>Qenlo Documentation</title>
  <link rel="icon" href="../assets/brand/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/brand/tokens.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      /* Typography */
      --base-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --base-font-size: 15px;
      --base-line-height: 1.68;

      /* Brand Colors */
      --theme-color: #E05343;
      --theme-color-dark: #B53C2F;
      --base-background-color: #0E1210;
      --base-color: #E8EBE9;
      
      /* Sidebar */
      --sidebar-background: #080B0A;
      --sidebar-border-color: #1F2723;
      --sidebar-border-width: 1px;
      --sidebar-width: 280px;
      --sidebar-name-color: #E8EBE9;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #969E9A;
      --sidebar-nav-link-color--active: #E05343;
      --sidebar-nav-link-font-weight--active: 600;

      /* Content Area */
      --content-max-width: 860px;
      --heading-color: #FFFFFF;
      --heading-font-weight: 700;
      --link-color: #E05343;
      --link-color--hover: #F06A5B;

      /* Code Blocks & Tables */
      --code-theme-background: #040605;
      --code-theme-text: #E8EBE9;
      --table-body-border-color: #1F2723;
      --table-head-border-color: #2A332E;
      --table-head-background: #171D1A;
      --table-row-odd-background: rgba(255, 255, 255, 0.015);
      
      /* Admonition / Blockquote */
      --blockquote-border-color: #E05343;
      --blockquote-background: #171D1A;
      --blockquote-color: #E8EBE9;

      /* Pagination */
      --pagination-title-color: #E8EBE9;
    }

    /* Brand Logo Lockup in Sidebar */
    .app-name-link {
      padding: 1.25rem 0.5rem 0.5rem;
      display: block;
    }
    .app-name-link img {
      max-height: 32px;
      width: auto;
    }

    /* Navbar / Version Tag */
    .app-nav {
      margin: 1.5rem 2rem 0 0;
    }
    .app-nav li {
      font-size: 0.85rem;
      font-family: var(--code-font-family);
    }
    .app-nav a {
      color: #969E9A !important;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      background: #171D1A;
      border: 1px solid #2A332E;
      transition: all 0.15s ease;
    }
    .app-nav a:hover {
      color: #FFFFFF !important;
      border-color: #E05343;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A332E;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3B4741;
    }

    /* Inline Code */
    :not(pre) > code {
      background: #171D1A !important;
      border: 1px solid #2A332E !important;
      color: #E05343 !important;
      border-radius: 4px !important;
      padding: 0.15em 0.35em !important;
      font-size: 0.88em !important;
    }

    /* Tables */
    table {
      border: 1px solid #1F2723;
      border-radius: 8px;
      overflow: hidden;
      margin: 1.5rem 0;
    }

    /* Search Input */
    .sidebar .search input {
      background: #171D1A !important;
      border: 1px solid #2A332E !important;
      color: #E8EBE9 !important;
      border-radius: 6px !important;
      font-family: var(--base-font-family) !important;
    }
    .sidebar .search input:focus {
      border-color: #E05343 !important;
      box-shadow: 0 0 0 2px rgba(224, 83, 67, 0.2) !important;
    }

    /* The docs index is a landing page; article routes keep the Docsify shell. */
    body.docs-home {
      --home-bg: oklch(0.185 0.012 155);
      --home-surface: oklch(0.225 0.014 155);
      --home-border: oklch(0.34 0.018 155);
      --home-text: oklch(0.965 0.008 80);
      --home-muted: oklch(0.71 0.015 155);
      --home-faint: oklch(0.55 0.015 155);
      --home-accent: oklch(0.73 0.14 32);
      background: var(--home-bg);
    }
    body.docs-home::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(to right, oklch(1 0 0 / 0.035) 1px, transparent 1px), linear-gradient(to bottom, oklch(1 0 0 / 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }
    body.docs-home .sidebar,
    body.docs-home .sidebar-toggle,
    body.docs-home .app-nav,
    body.docs-home .github-corner,
    body.docs-home .pagination-nav,
    body.docs-home .docsify-pagination-container { display: none; }
    body.docs-home .content { left: 0; padding: 0; }
    body.docs-home .markdown-section { max-width: none; margin: 0; padding: 0; color: var(--home-text); }
    body.docs-home .docs-landing a { color: inherit; text-decoration: none; }
    body.docs-home .docs-landing :focus-visible { outline: 2px solid var(--home-accent); outline-offset: 3px; }

    .docs-landing {
      position: relative;
      max-width: 1180px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 32px;
      font-family: var(--base-font-family);
    }
    .docs-landing__nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--home-border);
    }
    .docs-landing__brand { display: inline-flex; min-height: 44px; align-items: center; gap: 14px; }
    .docs-landing__brand img { display: block; }
    .docs-landing__brand span { padding-left: 14px; border-left: 1px solid var(--home-border); color: var(--home-muted); font-family: var(--code-font-family); font-size: 12px; }
    .docs-landing__nav-links,
    .docs-landing__footer nav { display: flex; align-items: center; gap: 28px; }
    .docs-landing__nav-links a,
    .docs-landing__footer a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--home-muted) !important;
      font-family: var(--code-font-family);
      font-size: 12px;
      transition: color 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .docs-landing__nav-links a:hover,
    .docs-landing__footer a:hover { color: var(--home-text) !important; }

    .docs-hero {
      min-height: 610px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(400px, 0.85fr);
      align-items: center;
      gap: clamp(48px, 8vw, 112px);
      padding: clamp(72px, 10vw, 132px) 0;
    }
    .docs-kicker { display: flex; align-items: center; gap: 10px; margin: 0 0 22px !important; color: var(--home-accent) !important; font-family: var(--code-font-family); font-size: 12px !important; letter-spacing: 0.03em; }
    .docs-kicker > span { width: 7px; height: 7px; border-radius: 50%; background: var(--home-accent); box-shadow: 0 0 0 5px oklch(0.73 0.14 32 / 0.12); }
    .docs-hero h1 { margin: 0 0 26px; color: var(--home-text); font-size: clamp(44px, 6vw, 76px); font-weight: 600; letter-spacing: -0.045em; line-height: 1.02; }
    .docs-hero h1 strong { color: var(--home-accent); font-weight: inherit; }
    .docs-hero__lede { max-width: 620px; margin: 0 0 34px !important; color: var(--home-muted) !important; font-size: clamp(16px, 1.7vw, 19px) !important; line-height: 1.65 !important; }
    .docs-hero__actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .docs-button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 20px;
      border: 1px solid var(--home-border);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      transition: background 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1), transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .docs-button--primary { background: var(--home-text); border-color: var(--home-text); color: var(--home-bg) !important; }
    .docs-button--secondary { background: var(--home-surface); }
    .docs-button:hover { transform: translateY(-2px); }
    .docs-button--secondary:hover { border-color: var(--home-accent); }

    .execution-trace {
      border: 1px solid var(--home-border);
      border-radius: 8px;
      background: oklch(0.15 0.01 155 / 0.88);
      box-shadow: 0 24px 80px oklch(0.08 0.01 155 / 0.35);
      overflow: hidden;
      font-family: var(--code-font-family);
    }
    .execution-trace__bar,
    .execution-trace__footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; background: var(--home-surface); color: var(--home-faint); font-size: 11px; }
    .execution-trace__bar { border-bottom: 1px solid var(--home-border); }
    .execution-trace__status { display: inline-flex; align-items: center; gap: 7px; color: oklch(0.78 0.1 160); }
    .execution-trace__status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .execution-trace__steps { margin: 0; padding: 6px 18px !important; list-style: none; }
    .execution-trace__steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 12px; margin: 0; padding: 16px 0; border-bottom: 1px solid oklch(1 0 0 / 0.06); }
    .execution-trace__steps li:last-child { border-bottom: 0; }
    .execution-trace__steps li > span { color: var(--home-accent); font-size: 10px; }
    .execution-trace__steps div { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .execution-trace__steps b { color: var(--home-text); font-size: 12px; font-weight: 400; }
    .execution-trace__steps small { color: var(--home-faint); font-family: var(--base-font-family); font-size: 11px; }
    .execution-trace__steps code { border: 0 !important; background: transparent !important; color: var(--home-muted) !important; font-size: 10px !important; }
    .execution-trace__footer { justify-content: flex-start; border-top: 1px solid var(--home-border); }
    .execution-trace__footer b { color: var(--home-text); font-weight: 400; }

    .docs-principles { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--home-border); border-bottom: 1px solid var(--home-border); }
    .docs-principles p { min-height: 112px; display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 !important; padding: 20px 22px; border-right: 1px solid var(--home-border); color: var(--home-faint) !important; font-size: 12px !important; }
    .docs-principles p:last-child { border-right: 0; }
    .docs-principles span { color: var(--home-accent); font-family: var(--code-font-family); font-size: 10px; }
    .docs-principles strong { color: var(--home-text); font-size: 14px; font-weight: 600; }

    .docs-paths,
    .docs-sdks { padding: clamp(80px, 10vw, 128px) 0; }
    .docs-section-heading { display: grid; grid-template-columns: 0.55fr 1.45fr; gap: 32px; margin-bottom: 54px; }
    .docs-section-heading p { margin: 8px 0 0 !important; color: var(--home-accent) !important; font-family: var(--code-font-family); font-size: 12px !important; }
    .docs-section-heading h2,
    .docs-sdks h2,
    .docs-boundary h2 { margin: 0; color: var(--home-text); font-size: clamp(30px, 4vw, 48px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.12; }
    .docs-path-list { border-top: 1px solid var(--home-border); }
    .docs-path-list > a { min-height: 128px; display: grid; grid-template-columns: 72px minmax(0, 1fr) 40px; align-items: center; gap: 22px; border-bottom: 1px solid var(--home-border); transition: background 180ms cubic-bezier(0.16, 1, 0.3, 1), padding 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .docs-path-list > a:hover { padding: 0 18px; background: var(--home-surface); }
    .docs-path-list__number { color: var(--home-accent); font-family: var(--code-font-family); font-size: 12px; }
    .docs-path-list a > span:nth-child(2) { display: flex; flex-direction: column; gap: 7px; }
    .docs-path-list strong { color: var(--home-text); font-size: 21px; font-weight: 600; }
    .docs-path-list small { color: var(--home-muted); font-size: 14px; }
    .docs-path-list__arrow { color: var(--home-muted); font-size: 22px; transition: color 180ms ease, transform 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .docs-path-list a:hover .docs-path-list__arrow { color: var(--home-accent); transform: translate(3px, -3px); }

    .docs-sdks { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: clamp(48px, 8vw, 108px); border-top: 1px solid var(--home-border); }
    .docs-sdks h2 { max-width: 480px; font-size: clamp(28px, 3.5vw, 43px); }
    .docs-sdk-links { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--home-border); }
    .docs-sdk-links a { min-height: 86px; display: flex; flex-direction: column; justify-content: center; padding: 16px 20px; border-right: 1px solid var(--home-border); border-bottom: 1px solid var(--home-border); transition: background 180ms ease; }
    .docs-sdk-links a:nth-child(2n) { border-right: 0; }
    .docs-sdk-links a:hover { background: var(--home-surface); }
    .docs-sdk-links span { color: var(--home-text); font-size: 15px; font-weight: 600; }
    .docs-sdk-links small { color: var(--home-faint); font-family: var(--code-font-family); font-size: 10px; }

    .docs-boundary { display: grid; grid-template-columns: 0.55fr 1.2fr 0.65fr; align-items: start; gap: 32px; margin: 0; padding: clamp(48px, 7vw, 80px); border: 1px solid oklch(0.73 0.14 32 / 0.45); border-radius: 8px; background: oklch(0.24 0.045 30); }
    .docs-boundary > p { margin: 4px 0 0 !important; color: var(--home-accent) !important; font-family: var(--code-font-family); font-size: 11px !important; }
    .docs-boundary h2 { font-size: clamp(28px, 3.4vw, 42px); }
    .docs-boundary div p { max-width: 580px; margin: 20px 0 0 !important; color: var(--home-muted) !important; line-height: 1.65 !important; }
    .docs-boundary > a { min-height: 44px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 10px; color: var(--home-text) !important; font-size: 13px; font-weight: 600; }

    .docs-landing__footer { min-height: 112px; display: flex; align-items: center; justify-content: space-between; gap: 32px; margin-top: 96px; border-top: 1px solid var(--home-border); color: var(--home-faint); font-family: var(--code-font-family); font-size: 11px; }

    @media (max-width: 900px) {
      .docs-hero { grid-template-columns: 1fr; min-height: 0; }
      .execution-trace { max-width: 620px; }
      .docs-principles { grid-template-columns: repeat(2, 1fr); }
      .docs-principles p:nth-child(2) { border-right: 0; }
      .docs-principles p:nth-child(-n+2) { border-bottom: 1px solid var(--home-border); }
      .docs-sdks { grid-template-columns: 1fr; }
      .docs-boundary { grid-template-columns: 1fr; }
      .docs-boundary > a { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      .docs-landing { padding: 0 20px; }
      .docs-landing__nav-links a:not(:last-child) { display: none; }
      .docs-hero { padding: 72px 0 80px; gap: 56px; }
      .docs-hero h1 { font-size: clamp(40px, 13vw, 56px); }
      .docs-hero__actions { align-items: stretch; flex-direction: column; }
      .execution-trace__steps li { grid-template-columns: 24px minmax(0, 1fr); }
      .execution-trace__steps code { display: none; }
      .execution-trace__footer { flex-wrap: wrap; }
      .docs-principles { grid-template-columns: 1fr; }
      .docs-principles p,
      .docs-principles p:nth-child(2) { min-height: 92px; border-right: 0; border-bottom: 1px solid var(--home-border); }
      .docs-principles p:last-child { border-bottom: 0; }
      .docs-section-heading { grid-template-columns: 1fr; gap: 14px; }
      .docs-path-list > a { grid-template-columns: 38px minmax(0, 1fr) 26px; min-height: 144px; gap: 10px; }
      .docs-path-list > a:hover { padding: 0 8px; }
      .docs-landing__footer { align-items: flex-start; flex-direction: column; justify-content: center; }
      .docs-landing__footer nav { flex-wrap: wrap; gap: 8px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .docs-landing *, .docs-landing *::before, .docs-landing *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app">Loading Qenlo documentation...</div>
  <script>
    window.$docsify = {
      name: 'Qenlo',
      logo: '../assets/brand/logo/lockup-reversed.svg',
      repo: 'https://github.com/a3ro-dev/qenlo',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      markdown: {
        renderer: {
          code(code, language) {
            if (language === 'mermaid') {
              return `<div class="mermaid">${code}</div>`;
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            const section = document.querySelector('.markdown-section');
            const route = window.location.hash.replace(/^#\/?/, '').split('?')[0];
            const isHome = route === '';
            document.body.classList.toggle('docs-home', isHome);

            if (isHome && section) {
              section.innerHTML = `
                <div class="docs-landing">
                  <nav class="docs-landing__nav" aria-label="Documentation navigation">
                    <a class="docs-landing__brand" href="../index.html" aria-label="Qenlo home">
                      <img src="../assets/brand/logo/lockup-reversed.svg" alt="Qenlo" width="112" height="32">
                      <span>DOCUMENTATION</span>
                    </a>
                    <div class="docs-landing__nav-links">
                      <a href="#/quickstart">Quickstart</a>
                      <a href="#/browser">Collection browser</a>
                      <a href="#/sdks/rust">SDKs</a>
                      <a href="https://github.com/a3ro-dev/qenlo">GitHub</a>
                    </div>
                  </nav>

                  <main>
                    <section class="docs-hero" aria-labelledby="docs-title">
                      <div>
                        <p class="docs-kicker"><span aria-hidden="true"></span> EMBEDDED VECTOR SEARCH · RESEARCH ALPHA</p>
                        <h1 id="docs-title">One record store.<br><strong>Exact retrieval.</strong></h1>
                        <p class="docs-hero__lede">Qenlo is a local-first embedded vector store for durable, metadata-filtered search. A canonical record store anchors the results; optional execution paths are observable and remain subject to the limits documented in this research alpha.</p>
                        <div class="docs-hero__actions">
                          <a class="docs-button docs-button--primary" href="#/quickstart">Build from source <span aria-hidden="true">→</span></a>
                          <a class="docs-button docs-button--secondary" href="#/browser">Open the collection browser <span aria-hidden="true">↗</span></a>
                        </div>
                      </div>
                      <div class="execution-trace" aria-label="Qenlo query flow">
                        <div class="execution-trace__bar"><span>QUERY FLOW</span><span class="execution-trace__status"><i aria-hidden="true"></i> inspectable</span></div>
                        <ol class="execution-trace__steps">
                          <li><span>01</span><div><b>Open a collection</b><small>Local files, explicit configuration</small></div><code>Collection::open</code></li>
                          <li><span>02</span><div><b>Apply metadata filters</b><small>Eligibility is defined before ranking</small></div><code>Filter</code></li>
                          <li><span>03</span><div><b>Run and inspect search</b><small>Results include execution details</small></div><code>ExecutionReport</code></li>
                        </ol>
                        <div class="execution-trace__footer">CPU exact is the default; GPU and ANN paths are optional.</div>
                      </div>
                    </section>

                    <section class="docs-principles" aria-label="Project principles">
                      <p><span>01 / DATA</span><strong>Canonical records</strong>Durable source of truth</p>
                      <p><span>02 / SEARCH</span><strong>Metadata first</strong>Filter before ranking</p>
                      <p><span>03 / SYSTEM</span><strong>Observable paths</strong>Inspect execution reports</p>
                      <p><span>04 / EVIDENCE</span><strong>Scoped claims</strong>Methods and limits published</p>
                    </section>

                    <section class="docs-paths" aria-labelledby="paths-title">
                      <div class="docs-section-heading"><p>FIND YOUR WAY</p><h2 id="paths-title">Start with the task in front of you.</h2></div>
                      <div class="docs-path-list">
                        <a href="#/quickstart"><span class="docs-path-list__number">01</span><span><strong>Build and run Qenlo</strong><small>Compile from this checkout, create a collection, search, and reopen it.</small></span><span class="docs-path-list__arrow" aria-hidden="true">↗</span></a>
                        <a href="#/browser"><span class="docs-path-list__number">02</span><span><strong>Browse a collection</strong><small>Inspect records and collection state with the available browser tooling.</small></span><span class="docs-path-list__arrow" aria-hidden="true">↗</span></a>
                        <a href="#/concepts"><span class="docs-path-list__number">03</span><span><strong>Understand the model</strong><small>Learn how records, filters, and execution reports fit together.</small></span><span class="docs-path-list__arrow" aria-hidden="true">↗</span></a>
                        <a href="#/architecture"><span class="docs-path-list__number">04</span><span><strong>Review storage and recovery</strong><small>Read the architecture, file format, and recovery policy.</small></span><span class="docs-path-list__arrow" aria-hidden="true">↗</span></a>
                        <a href="#/implementation-status"><span class="docs-path-list__number">05</span><span><strong>Check implementation status</strong><small>See what is supported, experimental, and still open.</small></span><span class="docs-path-list__arrow" aria-hidden="true">↗</span></a>
                      </div>
                    </section>

                    <section class="docs-sdks" aria-labelledby="sdks-title">
                      <div><p class="docs-kicker">LANGUAGE GUIDES</p><h2 id="sdks-title">Use the guidance for the code you have.</h2></div>
                      <div class="docs-sdk-links">
