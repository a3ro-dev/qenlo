[workspace]
members = [
    "crates/qenlo-core",
    "crates/qenlo",
    "crates/qenlo-bench",
    "crates/qenlo-testkit",
    "crates/qenlo-telemetry",
    "crates/qenlo-mobile",
    "crates/qenlo-ffi",
    "crates/qenlo-browser",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/a3ro-dev/qenlo"
homepage = "https://a3ro-dev.github.io/qenlo/docs/"
authors = ["Akshat Singh Kushwaha <akshatsingh14372@outlook.com>"]

[workspace.dependencies]
crc32fast = "1"
memmap2 = "0.9"
qenlo-core = { path = "crates/qenlo-core", version = "0.1.0-alpha.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
web-time = "1"

[profile.bench]
debug = true
lto = "thin"
