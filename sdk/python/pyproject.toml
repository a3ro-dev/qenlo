[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qenlo"
version = "0.1.0"
description = "Type-safe Python SDK for the embedded Qenlo vector database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Qenlo" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://a3ro-dev.github.io/qenlo/docs/"
Repository = "https://github.com/a3ro-dev/qenlo"
Issues = "https://github.com/a3ro-dev/qenlo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qenlo"]

[tool.hatch.build.targets.wheel.force-include]
"native" = "qenlo/native"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
